openapi: 3.0.3
info:
  title: KubeChaos Control Plane API
  version: 0.1.0
  description: |
    Public REST API of the KubeChaos control plane.

    Security model (see docs/architecture/architecture.md):
    - Authentication is a server-side session (BFF) carried in an HttpOnly cookie; the
      browser never receives OIDC or Kubernetes credentials.
    - Everything under /api/v1 is deny-by-default. Unknown paths under /api/v1 return 401
      to unauthenticated callers.
    - There is no endpoint that accepts commands, shell, kubectl, or PromQL.

    Every route implemented by the server must appear here (enforced by a unit test).
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: Process is running. Does not check dependencies.
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: Dependencies (PostgreSQL) are reachable. Failure details are logged, not returned.
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          $ref: "#/components/responses/Problem"
  /auth/login:
    get:
      operationId: startLogin
      summary: Start OIDC login (authorization code + PKCE S256)
      description: |
        Redirects the browser to the identity provider. `returnTo` must be a relative
        application path; anything else is replaced with `/` (no open redirects).
      security: []
      parameters:
        - name: returnTo
          in: query
          required: false
          schema: { type: string, maxLength: 512 }
      responses:
        "302":
          description: Redirect to the identity provider
        "503":
          $ref: "#/components/responses/Problem"
  /auth/callback:
    get:
      operationId: completeLogin
      summary: OIDC redirect URI
      description: |
        Validates the single-use state, exchanges the code (with PKCE verifier), verifies the
        ID token and nonce, creates a server-side session and sets the `__Host-kc_session`
        cookie (HttpOnly, Secure, SameSite=Strict). Any failure redirects to `/?loginError=1`.
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect to the requested application path, or to `/?loginError=1`
  /auth/logout:
    post:
      operationId: logout
      summary: End the session
      description: |
        Requires the session cookie, `Origin` equal to the public origin and the
        `X-KubeChaos-CSRF` header. Returns the IdP end-session URL for the browser to visit.
      parameters:
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [logoutUrl]
                properties:
                  logoutUrl: { type: string }
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /auth/backchannel-logout:
    post:
      operationId: backchannelLogout
      summary: OIDC Back-Channel Logout (identity provider → API)
      description: |
        Called server-to-server by the identity provider when an IdP session ends (logout,
        admin sign-out, revocation). Authenticated solely by the signed `logout_token`
        (signature, iss, aud, iat freshness, back-channel-logout event, no nonce).
        Deletes the application sessions created from that IdP session (`sid`), or every
        session of the subject when no `sid` is present.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token: { type: string, maxLength: 16384 }
      responses:
        "200":
          description: Sessions revoked (possibly none)
        "400":
          description: Invalid request or logout token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Current user identity, roles and authentication level
      description: Also returns the session's CSRF token, which the SPA must send in `X-KubeChaos-CSRF` on state-changing requests.
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/faults:
    get:
      operationId: listFaults
      summary: The finite catalogue of failure primitives (with risk level and typed parameters)
      responses:
        "200": { description: Fault catalogue, content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/scenarios:
    get:
      operationId: listScenarios
      summary: Built-in experiment templates (no user-defined scripts exist)
      responses:
        "200": { description: Scenarios, content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
  /api/v1/clusters:
    get:
      operationId: listClusters
      summary: Connected clusters with environment, policy summary and lock state
      responses:
        "200": { description: Clusters, content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/clusters/{id}:
    get:
      operationId: getCluster
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Cluster, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/experiments:
    get:
      operationId: listExperiments
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: Experiments (newest first), content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
    post:
      operationId: createExperiment
      summary: Request an experiment
      description: |
        The server sets clusterID and requestedBy; clients cannot assert identity. Unknown fields
        are rejected. The request is authorized (role), validated (schema), checked against the
        cluster's ChaosPolicy and the emergency-stop lock, may require step-up re-authentication
        (403 code=step_up_required: sign in again via /auth/login?stepUp=1) and explicit
        confirmation, and is audited whether allowed or denied.
      parameters: [{ $ref: "#/components/parameters/CSRFHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExperimentRequest" }
      responses:
        "201": { description: Submitted, content: { application/json: { schema: { type: object } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/experiments/{id}:
    get:
      operationId: getExperiment
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Experiment and timeline, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/experiments/{id}/cancel:
    post:
      operationId: cancelExperiment
      summary: Request cancellation (requester, approver or admin; no step-up needed)
      parameters: [{ $ref: "#/components/parameters/ID" }, { $ref: "#/components/parameters/CSRFHeader" }]
      responses:
        "202": { description: Cancellation requested, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/experiments/{id}/events:
    get:
      operationId: streamExperiment
      summary: Live updates (Server-Sent Events)
      description: "Events: `experiment` (full state), `timeline` (one entry), `resync` (reload). Heartbeat every 15s; max 5 streams per user; streams end after 30 min (EventSource reconnects)."
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: Event stream, content: { text/event-stream: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /api/v1/system/lock:
    get:
      operationId: getLock
      summary: Emergency-stop state
      responses:
        "200": { description: Lock state, content: { application/json: { schema: { type: object } } } }
  /api/v1/admin/lock:
    post:
      operationId: engageLock
      summary: Engage the emergency stop (admin). Unlocking is only possible with kubechaosctl.
      parameters: [{ $ref: "#/components/parameters/CSRFHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 512 }
      responses:
        "201": { description: Locked, content: { application/json: { schema: { type: object } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit:
    get:
      operationId: listAudit
      summary: Audit log, newest first (auditor only; read-only — there is no write or delete API)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: before, in: query, required: false, schema: { type: integer }, description: "Return events with seq < before (paging)" }
      responses:
        "200": { description: Audit events, content: { application/json: { schema: { $ref: "#/components/schemas/ItemList" } } } }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/audit/verify:
    get:
      operationId: verifyAudit
      summary: Verify the audit hash chain (auditor only)
      responses:
        "200": { description: Chain intact, content: { application/json: { schema: { type: object } } } }
        "409": { $ref: "#/components/responses/Problem" }
components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, maxLength: 64 }
    CSRFHeader:
      name: X-KubeChaos-CSRF
      in: header
      required: true
      description: Session CSRF token from GET /api/v1/me.
      schema: { type: string, minLength: 43, maxLength: 43 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-kc_session
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
        version: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
        code:
          type: string
          description: Machine-readable reason, e.g. step_up_required, policy_violation, approval_required, locked.
        reasons:
          type: array
          items: { type: string }
    ItemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: object } }
    CreateExperimentRequest:
      type: object
      additionalProperties: false
      required: [maxDuration, steps, confirm]
      properties:
        description: { type: string, maxLength: 500 }
        maxDuration: { type: string, pattern: "^([0-9]{1,4}(s|m|h)){1,3}$" }
        confirm: { type: boolean, description: Explicit confirmation (UX; not a security boundary). }
        steps:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            properties:
              fault:
                type: object
                additionalProperties: false
                required: [type, target]
                properties:
                  type: { type: string, enum: [PodKill] }
                  target:
                    type: object
                    additionalProperties: false
                    required: [namespace, selector]
                    properties:
                      namespace: { type: string, maxLength: 63 }
                      selector: { type: object, minProperties: 1, maxProperties: 10, additionalProperties: { type: string, maxLength: 63 } }
                  podKill:
                    type: object
                    additionalProperties: false
                    required: [count]
                    properties:
                      count: { type: integer, minimum: 1, maximum: 10 }
                      gracePeriodSeconds: { type: integer, minimum: 0, maximum: 300 }
              wait:
                type: object
                additionalProperties: false
                required: [duration]
                properties:
                  duration: { type: string }
        successCriteria:
          type: array
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [metric, operator, value]
            properties:
              metric: { type: string, enum: [available_replicas, ready_ratio, recovery_time, http_error_rate, http_latency_p99] }
              operator: { type: string, enum: [lt, le, gt, ge, eq] }
              value: { type: string, maxLength: 16 }
              weight: { type: integer, minimum: 1, maximum: 100 }
    CurrentUser:
      type: object
      additionalProperties: false
      required: [subject, issuer, roles, authLevel, csrfToken]
      properties:
        subject: { type: string }
        issuer: { type: string }
        displayName: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [viewer, experimenter, approver, admin, auditor]
        authLevel:
          type: string
          description: Keycloak ACR level of the current session (e.g. "1" password, "2" MFA step-up).
        csrfToken:
          type: string
          description: Send as X-KubeChaos-CSRF on POST/PUT/PATCH/DELETE.
security:
  - sessionCookie: []
