# Local development cluster. Node image defaults to the one pinned by the kind release
# installed in the devcontainer (see .devcontainer/devcontainer.json).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubechaos-dev
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
  - role: worker
  - role: worker
