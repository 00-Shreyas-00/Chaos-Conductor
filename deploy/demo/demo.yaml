# Demo workloads for PodKill (development only). Every workload exercises one safety rule:
#   web          3 replicas  -> killable (at most 2, one Ready replica always survives)
#   solo         1 replica   -> never killable (would leave the workload with no Ready pod)
#   db           2 replicas, pods labelled protected -> never selected
#   orphan       bare pod, no controller -> never selected (it would not come back)
# Images: registry.k8s.io/pause (no shell, no network), pinned by digest.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    chaos.kubechaos.io/enabled: "true"
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: demo }
spec:
  replicas: 3
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web, tier: frontend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 50m, memory: 16Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: solo, namespace: demo }
spec:
  replicas: 1
  selector: { matchLabels: { app: solo } }
  template:
    metadata: { labels: { app: solo } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 50m, memory: 16Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: db, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: db } }
  template:
    metadata: { labels: { app: db, chaos.kubechaos.io/protected: "true" } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
          resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 50m, memory: 16Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Pod
metadata: { name: orphan, namespace: demo, labels: { app: orphan } }
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 65532, seccompProfile: { type: RuntimeDefault } }
  terminationGracePeriodSeconds: 5
  containers:
    - name: app
      image: registry.k8s.io/pause@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a
      resources: { requests: { cpu: 5m, memory: 8Mi }, limits: { cpu: 50m, memory: 16Mi } }
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
