{{- /*
  Operator RBAC — every rule is documented in docs/architecture/architecture.md §7 and
  pinned by deploy/helm/kubechaos-operator/rbac.snapshot.yaml (`make rbac-check`).
  Foundation step 10: namespace-scoped only. No ClusterRole, no pods, no secrets, no exec,
  no RBAC verbs. Later steps add rules one at a time, each with a snapshot diff.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubechaos-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechaos-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubechaos-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechaos-operator.labels" . | nindent 4 }}
rules:
  # Cluster identity: read exactly one named ConfigMap. No list/watch.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["kubechaos-cluster-identity"]
    verbs: ["get"]
  # Leader election. `create` cannot be restricted by resourceNames; the rest is.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kubechaos-operator.chaos.kubechaos.io"]
    verbs: ["get", "update"]
  # Leader-election events (and, later, experiment timeline events) in its own namespace.
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Step 11: read experiment requests; write ONLY their status. The operator can never create,
  # change or delete an experiment (the control plane requests, cluster admins own policy).
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaosexperiments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaosexperiments/status"]
    verbs: ["get", "update", "patch"]
---
# Cluster-scoped KubeChaos objects. Read-only except recording attestation use.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubechaos-operator
  labels:
    {{- include "kubechaos-operator.labels" . | nindent 4 }}
rules:
  # The one cluster policy, read-only (cluster admins own it).
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaospolicies"]
    resourceNames: ["default"]
    verbs: ["get"]
  # Emergency-stop locks: observe only. Never create or delete.
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaoslocks"]
    verbs: ["get", "list", "watch"]
  # Single-use approval attestations: create only (AlreadyExists = replay).
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaosattestationuses"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubechaos-operator
  labels:
    {{- include "kubechaos-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubechaos-operator
subjects:
  - kind: ServiceAccount
    name: kubechaos-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubechaos-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechaos-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubechaos-operator
subjects:
  - kind: ServiceAccount
    name: kubechaos-operator
    namespace: {{ .Release.Namespace }}
