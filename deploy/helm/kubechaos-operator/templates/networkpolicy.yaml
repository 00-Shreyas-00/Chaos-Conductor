{{- if .Values.networkPolicy.enabled }}
{{- if and (eq (.Values.clusterIdentity.environment | toString) "production") (empty .Values.networkPolicy.apiServerCIDRs) }}
{{- fail "networkPolicy.apiServerCIDRs must list the API server addresses in production (ports-only egress would allow any host)" }}
{{- end }}
# Default deny for the operator pod, then allow only egress to the Kubernetes API server.
# The operator uses the in-cluster KUBERNETES_SERVICE_HOST IP, so it needs no DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubechaos-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubechaos-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kubechaos-operator.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress: []   # nothing may connect in (kubelet health probes are not subject to NetworkPolicy)
  egress:
    - ports:
        {{- range .Values.networkPolicy.apiServerPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with .Values.networkPolicy.apiServerCIDRs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
{{- end }}
