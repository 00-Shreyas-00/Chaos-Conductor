# Source: kubechaos-operator/templates/control-plane-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubechaos-control-plane
  namespace: kubechaos-system
  labels:
    app.kubernetes.io/name: kubechaos-operator
    app.kubernetes.io/instance: kubechaos-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: kubechaos
