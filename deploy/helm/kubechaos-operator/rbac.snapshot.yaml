# Source: kubechaos-operator/templates/control-plane-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubechaos-control-plane
  labels:
    app.kubernetes.io/name: kubechaos-operator
    app.kubernetes.io/instance: kubechaos-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: kubechaos
rules:
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaospolicies"]
    resourceNames: ["default"]
    verbs: ["get"]
  # Engage the emergency stop (create) and see it; never delete (= unlock).
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaoslocks"]
    verbs: ["get", "list", "watch", "create"]

---
# Source: kubechaos-operator/templates/rbac.yaml
# Cluster-scoped KubeChaos objects. Read-only except recording attestation use.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubechaos-operator
  labels:
    app.kubernetes.io/name: kubechaos-operator
    app.kubernetes.io/instance: kubechaos-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: kubechaos
rules:
  # The one cluster policy, read-only (cluster admins own it).
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaospolicies"]
    resourceNames: ["default"]
    verbs: ["get"]
  # Emergency-stop locks: observe only. Never create or delete.
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaoslocks"]
    verbs: ["get", "list", "watch"]
  # Single-use approval attestations: create only (AlreadyExists = replay).
  - apiGroups: ["chaos.kubechaos.io"]
    resources: ["chaosattestationuses"]
    verbs: ["create"]

