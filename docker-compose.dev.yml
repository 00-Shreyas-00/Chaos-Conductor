# Local development infrastructure. NOT for production.
# All ports bind to 127.0.0.1 only. Secrets come from .env (generated by `make env`, gitignored).
# Images are pinned by digest; update deliberately.
name: kubechaos-dev

services:
  postgres:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?run make env}
      # The image trusts local-socket and loopback connections by default; require passwords everywhere.
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
      # Role passwords consumed by deploy/postgres/init/10-databases.sh
      KUBECHAOS_MIGRATOR_PASSWORD: ${KUBECHAOS_MIGRATOR_PASSWORD:?run make env}
      KUBECHAOS_APP_PASSWORD: ${KUBECHAOS_APP_PASSWORD:?run make env}
      KUBECHAOS_AUDITOR_PASSWORD: ${KUBECHAOS_AUDITOR_PASSWORD:?run make env}
      APPROVER_MIGRATOR_PASSWORD: ${APPROVER_MIGRATOR_PASSWORD:?run make env}
      APPROVER_APP_PASSWORD: ${APPROVER_APP_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    # Separate trust domain: Keycloak keeps its own embedded dev store, not the app database.
    image: quay.io/keycloak/keycloak:26.3@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?run make env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # Image has no curl; probe the management port's readiness endpoint with bash /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  keycloak-data:
